<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivio - Flusso di Coscienza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="site-header">
        <h1>Flusso di Coscienza</h1>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="leggi.html">Leggi</a>
            <a href="vota.html">Vota</a>
            <a href="proponi.html">Proponi</a>
            <a href="discuti.html">Discuti</a>
            <a href="archivio.html" class="active">Archivio</a>
            <a href="redazione.html" class="btn-owner">Redazione</a>
        </nav>
    </header>

    <main class="container">
        <h2 class="section-title">Archivio per Categorie</h2>
        <div class="categorie-filter">
            <button onclick="filtraCategoria('TUTTI')" class="btn-cat active">TUTTI</button>
            <button onclick="filtraCategoria('ATTUALITA\'')" class="btn-cat">ATTUALITA'</button>
            <button onclick="filtraCategoria('POLITICA')" class="btn-cat">POLITICA</button>
            <button onclick="filtraCategoria('SCIENZA')" class="btn-cat">SCIENZA</button>
            <button onclick="filtraCategoria('FILOSOFIA')" class="btn-cat">FILOSOFIA</button>
        </div>

        <div id="archivio-grid" class="articoli-grid" style="margin-top: 35px;"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbvUTpkonXNDj5f7amxWPilzWmYYuwywI",
            authDomain: "flusso-di-coscienza-4e96d.firebaseapp.com",
            projectId: "flusso-di-coscienza-4e96d",
            storageBucket: "flusso-di-coscienza-4e96d.firebasestorage.app",
            messagingSenderId: "617712339143",
            appId: "1:617712339143:web:75561b57885ff8c44ad6e2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let tuttiArticoli = [];

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const querySnapshot = await getDocs(collection(db, "articoli"));
                querySnapshot.forEach(doc => tuttiArticoli.push(doc.data()));
                tuttiArticoli.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                mostraArticoli(tuttiArticoli);
            } catch (err) {
                console.error(err);
            }
        });

        window.filtraCategoria = function(cat) {
            document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            if (cat === 'TUTTI') {
                mostraArticoli(tuttiArticoli);
            } else {
                const filtrati = tuttiArticoli.filter(a => a.categoria === cat);
                mostraArticoli(filtrati);
            }
        };

        function mostraArticoli(lista) {
            const container = document.getElementById("archivio-grid");
            container.innerHTML = "";
            if (lista.length === 0) {
                container.innerHTML = "<p>Nessun articolo trovato in questa categoria.</p>";
                return;
            }
            lista.forEach(articolo => {
                container.innerHTML += `
                    <div class="card-articolo">
                        ${articolo.immagine ? `<img src="${articolo.immagine}" class="articolo-img">` : ''}
                        <div class="card-contenuto">
                            <span class="categoria">${articolo.categoria}</span>
                            <h3>${articolo.titolo}</h3>
                            <small>Pubblicato il: ${articolo.data}</small>
                            <div class="testo-articolo">${articolo.testo}</div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
