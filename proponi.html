<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proponi Articolo - Flusso di Coscienza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="site-header">
        <h1 id="titolo-dinamico" class="titolo-ibrido"></h1>
        <p>pensieri liberi</p>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="leggi.html">Leggi</a>
            <a href="vota.html">Vota</a>
            <a href="proponi.html" class="active">Proponi</a>
            <a href="discuti.html">Discuti</a>
            <a href="archivio.html">Archivio</a>
            <a href="redazione.html" class="btn-owner">Redazione</a>
        </nav>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>Proponi il tuo Articolo</h2>
            <p>Compila il modulo per inviare la tua idea o il tuo pezzo completo alla redazione per la revisione[cite: 6].</p>
            <form id="proposta-form" style="margin-top: 25px;">
                <div class="form-group">
                    <label for="autore">Autore</label>
                    <input type="text" id="autore" required placeholder="Nome o pseudonimo...">
                </div>
                <div class="form-group">
                    <label for="titolo-prop">Titolo</label>
                    <input type="text" id="titolo-prop" required placeholder="Titolo...">
                </div>
                <div class="form-group">
                    <label for="testo-prop">Testo dell'articolo</label>
                    <textarea id="testo-prop" rows="8" required placeholder="Scrivi qui il tuo articolo..."></textarea>
                </div>
                <button type="submit" class="btn-pubblica">Invia alla Redazione</button>
            </form>
        </div>
    </main>

    <!-- SDK Firebase e logica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbvUTpkonXNDj5f7amxWPilzWmYYuwywI",
            authDomain: "flusso-di-coscienza-4e96d.firebaseapp.com",
            projectId: "flusso-di-coscienza-4e96d",
            storageBucket: "flusso-di-coscienza-4e96d.firebasestorage.app",
            messagingSenderId: "617712339143",
            appId: "1:617712339143:web:75561b57885ff8c44ad6e2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener("scroll", () => {
            const header = document.getElementById("site-header");
            if (window.scrollY > 50) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            const testoTitolo = "Flusso di Coscienza";
            const classiFont = ['l-0', 'l-1', 'l-2', 'l-3', 'l-4', 'l-5', 'l-6', 'l-7', 'l-8', 'l-9', 'l-10', 'l-11', 'l-12', 'l-13', 'l-14', 'l-15', 'l-16', 'l-17'];
            const h1Element = document.getElementById("titolo-dinamico");
            if (h1Element) {
                h1Element.innerHTML = "";
                for (let i = 0; i < testoTitolo.length; i++) {
                    const span = document.createElement("span");
                    span.innerText = testoTitolo[i];
                    span.className = classiFont[Math.floor(Math.random() * classiFont.length)];
                    h1Element.appendChild(span);
                }
            }
        });

        document.getElementById("proposta-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const autore = document.getElementById("autore").value.trim();
            const titolo = document.getElementById("titolo-prop").value.trim();
            const testo = document.getElementById("testo-prop").value.trim();

            try {
                await addDoc(collection(db, "proposte"), {
                    autore,
                    titolo,
                    testo,
                    data: new Date().toLocaleDateString(),
                    timestamp: Date.now()
                });

                alert("Articolo inviato con successo! La redazione lo esaminerà presto.");
                window.location.href = "index.html";
            } catch (err) {
                console.error("Errore nell'invio della proposta:", err);
                alert("Errore durante l'invio dell'articolo. Riprova.");
            }
        });
    </script>
</body>
</html>
