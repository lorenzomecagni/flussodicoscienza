<body>

            <a href="discuti.html"><svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg> Discuti</a>
            <a href="archivio.html"><svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg> Archivio</a>

        </nav>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>Proponi il tuo Articolo</h2>
            <p>Compila il modulo per inviare la tua idea o il tuo pezzo completo alla redazione.</p>
            <form id="proposta-form" style="margin-top: 25px;">
                <div class="form-group">
                    <label>Autore</label>
                    <input type="text" id="autore" required placeholder="Nome o pseudonimo...">
                </div>
                <div class="form-group">
                    <label>Titolo</label>
                    <input type="text" id="titolo-prop" required placeholder="Titolo...">
                </div>
                <div class="form-group">
                    <label>Testo dell'articolo</label>
                    <textarea id="testo-prop" rows="8" required placeholder="Scrivi qui..."></textarea>
                </div>
                <button type="submit" class="btn-pubblica">Invia alla Redazione</button>
            </form>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbvUTpkonXNDj5f7amxWPilzWmYYuwywI",
            authDomain: "flusso-di-coscienza-4e96d.firebaseapp.com",
            projectId: "flusso-di-coscienza-4e96d",
            storageBucket: "flusso-di-coscienza-4e96d.firebasestorage.app",
            messagingSenderId: "617712339143",
            appId: "1:617712339143:web:75561b57885ff8c44ad6e2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener("scroll", () => {
            const header = document.getElementById("site-header");
            if (window.scrollY > 50) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            const testoTitolo = "Flusso di Coscienza";
            const classiFont = ['l-0', 'l-1', 'l-2', 'l-3', 'l-4', 'l-5', 'l-6', 'l-7', 'l-8', 'l-9', 'l-10', 'l-11', 'l-12', 'l-13', 'l-14', 'l-15', 'l-16', 'l-17'];
            const h1Element = document.getElementById("titolo-dinamico");
            if (h1Element) {
                h1Element.innerHTML = "";
                for (let i = 0; i < testoTitolo.length; i++) {
                    const span = document.createElement("span");
                    span.innerText = testoTitolo[i];
                    span.className = classiFont[Math.floor(Math.random() * classiFont.length)];
                    h1Element.appendChild(span);
                }
            }
        });

        document.getElementById("proposta-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            try {
                await addDoc(collection(db, "proposte"), {
                    autore: document.getElementById("autore").value.trim(),
                    titolo: document.getElementById("titolo-prop").value.trim(),
                    testo: document.getElementById("testo-prop").value.trim(),
                    data: new Date().toLocaleDateString(),
                    timestamp: Date.now()
                });
                alert("Articolo inviato con successo alla redazione!");
                window.location.href = "index.html";
            } catch (err) {
                alert("Errore nell'invio.");
            }
        });
    </script>
</body>
</html>
