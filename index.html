<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flusso di Coscienza - Pensieri Liberi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="site-header">
        <h1>Flusso di Coscienza</h1>
        <p>pensieri liberi</p>
        <nav class="main-nav">
            <a href="index.html" class="active">Home</a>
            <a href="leggi.html">Leggi</a>
            <a href="vota.html">Vota</a>
            <a href="proponi.html">Proponi</a>
            <a href="discuti.html">Discuti</a>
            <a href="archivio.html">Archivio</a>
            <a href="redazione.html" class="btn-owner">Redazione</a>
        </nav>
    </header>

    <main class="container">
        <h2 class="section-title">Novità</h2>
        <div id="lista-articoli" class="articoli-grid">
            <p>Caricamento articoli da Firebase...</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbvUTpkonXNDj5f7amxWPilzWmYYuwywI",
            authDomain: "flusso-di-coscienza-4e96d.firebaseapp.com",
            projectId: "flusso-di-coscienza-4e96d",
            storageBucket: "flusso-di-coscienza-4e96d.firebasestorage.app",
            messagingSenderId: "617712339143",
            appId: "1:617712339143:web:75561b57885ff8c44ad6e2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener("DOMContentLoaded", async () => {
            let articoli = [];
            try {
                const querySnapshot = await getDocs(collection(db, "articoli"));
                querySnapshot.forEach((doc) => {
                    articoli.push(doc.data());
                });
                articoli.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            } catch (err) {
                console.error("Errore caricamento:", err);
            }

            const container = document.getElementById("lista-articoli");
            container.innerHTML = "";
            if (articoli.length === 0) {
                container.innerHTML = "<p>Nessun articolo presente.</p>";
                return;
            }

            articoli.forEach((articolo) => {
                const card = document.createElement("div");
                card.className = "card-articolo";
                card.innerHTML = `
                    ${articolo.immagine ? `<img src="${articolo.immagine}" class="articolo-img">` : ''}
                    <div class="card-contenuto">
                        <span class="categoria">${articolo.categoria}</span>
                        <h3>${articolo.titolo}</h3>
                        <small>Pubblicato il: ${articolo.data}</small>
                        <div class="testo-articolo">${articolo.testo}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
