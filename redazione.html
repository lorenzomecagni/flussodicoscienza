    <script>
        const HASH_PASSWORD_CORRETTO = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9";
        let articoliInMemoria = [];
        let proposteInMemoria = [];
        let commentiInMemoria = [];
        let sondaggiArchiviatiInMemoria = [];

        window.addEventListener("firebase-ready", async () => {
            inizializzaPagina();
        });

        document.addEventListener("DOMContentLoaded", () => {
            const testoTitolo = "Flusso di Coscienza";
            const classiFont = ['l-0', 'l-1', 'l-2', 'l-3', 'l-4', 'l-5', 'l-6', 'l-7', 'l-8', 'l-9', 'l-10', 'l-11', 'l-12', 'l-13', 'l-14', 'l-15', 'l-16', 'l-17'];
            const h1Element = document.getElementById("titolo-dinamico");
            if (h1Element) {
                h1Element.innerHTML = "";
                for (let i = 0; i < testoTitolo.length; i++) {
                    const span = document.createElement("span");
                    span.innerText = testoTitolo[i];
                    span.className = classiFont[Math.floor(Math.random() * classiFont.length)];
                    h1Element.appendChild(span);
                }
            }

            if (sessionStorage.getItem("owner_logged") === "true") {
                mostraPannello();
            }
        });

        async function inizializzaPagina() {
            if (!window.db) return;
            
            try {
                const configSnap = await window.getDocs(window.collection(window.db, "configurazioni"));
                configSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (docSnap.id === "sondaggio_attivo") {
                        if(data.categoria) document.getElementById("categoria-sondaggio").value = data.categoria;
                        if(data.domanda) document.getElementById("input-sondaggio").value = data.domanda;
                        if(data.opzioni) caricaCampiOpzioni(data.opzioni);
                    }
                    if (docSnap.id === "discussione_attiva") {
                        if(data.argomento) document.getElementById("input-discussione").value = data.argomento;
                    }
                });

                if(!document.getElementById("input-sondaggio").value) {
                    document.getElementById("input-sondaggio").value = "L'intelligenza artificiale sostituirà il pensiero critico umano?";
                    caricaCampiOpzioni(["Sì, inevitabilmente", "No, stimolerà nuove forme di pensiero", "Dipende da come la utilizzeremo"]);
                }
                if(!document.getElementById("input-discussione").value) {
                    document.getElementById("input-discussione").value = "Dibattito del Mese";
                }

                if (sessionStorage.getItem("owner_logged") === "true") {
                    caricaDatiPannello();
                }
            } catch (err) {
                console.error("Errore caricamento dati iniziali da Firestore:", err);
            }
        }

        function caricaCampiOpzioni(opzioni) {
            const container = document.getElementById("container-opzioni");
            container.innerHTML = "";
            opzioni.forEach(opt => {
                aggiungiCampoOpzione(opt);
            });
        }

        function aggiungiCampoOpzione(valore = "") {
            const container = document.getElementById("container-opzioni");
            const div = document.createElement("div");
            div.style.cssText = "display: flex; gap: 8px; align-items: center;";
            div.innerHTML = `
                <input type="text" class="input-opzione" value="${valore}" required placeholder="Testo opzione..." style="flex:1;">
                <button type="button" class="btn-cat" style="background:#991b1b; color:#fff; border-color:#991b1b; padding: 10px 14px;" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(div);
        }

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verificaPassword() {
            const pwd = document.getElementById("owner-password").value;
            const hashDigitato = await sha256(pwd);

            if (hashDigitato === HASH_PASSWORD_CORRETTO) {
                sessionStorage.setItem("owner_logged", "true");
                mostraPannello();
            } else {
                alert("Password errata! Accesso negato.");
                document.getElementById("owner-password").value = "";
            }
        }

            document.getElementById("login-box").style.display = "none";
            document.getElementById("redazione-panel").style.display = "block";
            await caricaDatiPannello();

            if (!window.db) return;
            await caricaListaGestione();

            sessionStorage.removeItem("owner_logged");

        /* --- FUNZIONE DI COMPRESSIONE E RIDIMENSIONAMENTO LATO CLIENT --- */
        function comprimiImmagineDaPC(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                    callback(compressedDataUrl);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Gestione copertina: comprime automaticamente l'immagine caricata da PC
        document.getElementById("file-immagine").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (file) {
                comprimiImmagineDaPC(file, 1000, 0.8, function(baseCompressedUrl) {
                    document.getElementById("immagine-url").value = baseCompressedUrl;
                    document.getElementById("preview-container").innerHTML = `<img src="${baseCompressedUrl}" style="max-height: 100px; border-radius: 4px;" alt="Anteprima">`;
                });
            }
        });

        document.getElementById("immagine-url").addEventListener("input", function(e) {
            const url = e.target.value.trim();
            if (url) {
                document.getElementById("preview-container").innerHTML = `<img src="${url}" style="max-height: 100px; border-radius: 4px;" alt="Anteprima" onerror="this.onerror=null; this.src='';">`;
            } else {
                document.getElementById("preview-container").innerHTML = "";
            }
        });

        function formatText(command) {
            document.execCommand(command, false, null);
            document.getElementById('editor-testo').focus();
        }

        function triggerArticoloImmagine() {
            document.getElementById("file-img-articolo").click();
        }

        // Gestione immagini nel testo: comprime automaticamente l'immagine selezionata
        function inserisciImmagineTestoDaPC(input) {
            const file = input.files[0];
            if (file) {
                comprimiImmagineDaPC(file, 800, 0.75, function(baseCompressedUrl) {
                    document.execCommand('insertImage', false, baseCompressedUrl);
                    document.getElementById('editor-testo').focus();
                });
            }
            input.value = "";
        }

        async function caricaListaGestione() {
            const container = document.getElementById("lista-gestione-articoli");
            container.innerHTML = "<p>Caricamento articoli...</p>";
            
            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "articoli"));
                articoliInMemoria = [];
                querySnapshot.forEach(docSnap => {
                    articoliInMemoria.push({ id: docSnap.id, ...docSnap.data() });
                });

                container.innerHTML = "";
                if (articoliInMemoria.length === 0) {
                    container.innerHTML = "<p>Nessun articolo pubblicato.</p>";
                    return;
                }

                articoliInMemoria.forEach((art) => {
                    const div = document.createElement("div");
                    div.style.cssText = "background: #fcfbf7; padding: 15px; border-radius: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #d4cbb8;";
                    div.innerHTML = `
                        <div>
                            <strong style="font-size:1.1rem; color:#111;">${art.titolo}</strong><br>
                            <small style="color:#666;">[${art.categoria}] - ${art.data}</small>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button type="button" class="btn-cat" onclick="preparaModifica('${art.id}')">Modifica</button>
                            <button type="button" class="btn-cat" style="background:#991b1b; color:#fff; border-color:#991b1b;" onclick="eliminaArticolo('${art.id}')">Elimina</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                console.error("Errore caricamento articoli:", e);
                container.innerHTML = "<p>Errore nel caricamento degli articoli da Firestore.</p>";
            }
        }

        async function caricaListaSondaggiArchiviati() {

            container.innerHTML = "<p>Caricamento sondaggi archiviati...</p>";

            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "sondaggi_archiviati"));
                sondaggiArchiviatiInMemoria = [];
                querySnapshot.forEach(docSnap => {
                    sondaggiArchiviatiInMemoria.push({ id: docSnap.id, ...docSnap.data() });
                });

                container.innerHTML = "";
                if (sondaggiArchiviatiInMemoria.length === 0) {
                    container.innerHTML = "<p>Nessun sondaggio archiviato.</p>";
                    return;
                }

                sondaggiArchiviatiInMemoria.forEach((sondaggio) => {
                    const div = document.createElement("div");
                    div.style.cssText = "background: #fcfbf7; padding: 15px; border-radius: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #d4cbb8;";

                        <div>
                            <strong style="font-size:1.1rem; color:#111;">${sondaggio.domanda}</strong><br>

            if (confirm("Sei sicuro di voler eliminare definitivamente questo sondaggio dall'archivio?")) {
                try {
                    await window.deleteDoc(window.doc(window.db, "sondaggi_archiviati", id));
                    await caricaListaSondaggiArchiviati();
                    alert("Sondaggio archiviato eliminato con successo.");
                } catch (e) {
                    console.error("Errore eliminazione sondaggio archiviato:", e);
                    alert("Errore durante l'eliminazione.");
                }

        async function caricaListaCommentiRedazione() {
            const container = document.getElementById("lista-gestione-commenti");
            container.innerHTML = "<p>Caricamento discussioni...</p>";

            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "commenti_agora"));
                commentiInMemoria = [];
                querySnapshot.forEach(docSnap => {
                    commentiInMemoria.push({ id: docSnap.id, ...docSnap.data() });
                });

                container.innerHTML = "";
                if (commentiInMemoria.length === 0) {
                    container.innerHTML = "<p>Nessun intervento presente nella discussione.</p>";
                    return;
                }

                commentiInMemoria.forEach((com) => {
                    const div = document.createElement("div");
                    div.style.cssText = "background: #fcfbf7; padding: 15px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #d4cbb8;";
                    
                    let risposteHtml = "";
                    if (com.risposte && com.risposte.length > 0) {
                        com.risposte.forEach(resp => {
                            risposteHtml += `
                                <div style="background: #f0ebe1; padding: 10px; border-radius: 4px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center;">
                                    <div style="max-width: 80%;">
                                        <strong style="font-size: 0.9rem; color:#333;">↳ ${resp.autore}</strong> <small style="color:#666;">(${resp.data})</small>
                                        <p style="margin: 4px 0 0 0; font-size: 0.9rem; color:#444;">${resp.testo}</p>
                                    </div>
                                    <button type="button" class="btn-cat" style="background:#991b1b; color:#fff; border-color:#991b1b; padding: 4px 8px; font-size: 0.8rem;" onclick="eliminaRispostaRedazione('${com.id}', ${resp.id})">Elimina</button>
                                </div>

                        });

                    div.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div style="max-width: 75%;">
                                <strong style="color:#111;">${com.autore}</strong> <small style="color:#666;">(${com.data}) - ❤️ ${com.likes || 0} likes</small>
                                <p style="margin: 6px 0 0 0; font-size: 0.95rem; color:#333; line-height: 1.4;">${com.testo}</p>
                            </div>
                            <div>
                                <button type="button" class="btn-cat" style="background:#991b1b; color:#fff; border-color:#991b1b;" onclick="eliminaCommentoAgora('${com.id}')">Elimina</button>

                            ${risposteHtml}
                        </div>

                    container.appendChild(div);
                });
            } catch (e) {
                console.error("Errore commenti:", e);
                container.innerHTML = "<p>Errore nel caricamento dei commenti.</p>";
            }
        }

        async function eliminaCommentoAgora(id) {
            if (confirm("Sei sicuro di voler eliminare questo commento e tutte le sue risposte?")) {
                try {
                    await window.deleteDoc(window.doc(window.db, "commenti_agora", id));
                    await caricaListaCommentiRedazione();
                    alert("Commento eliminato.");
                } catch (e) {
                    console.error("Errore eliminazione commento:", e);
                    alert("Errore durante l'eliminazione.");
                }
            }
        }

        async function eliminaRispostaRedazione(commentoId, rispostaId) {
            if (confirm("Sei sicuro di voler eliminare questa risposta?")) {
                try {
                    const commento = commentiInMemoria.find(c => c.id === commentoId);
                    if (commento && commento.risposte) {
                        commento.risposte = commento.risposte.filter(r => r.id !== rispostaId);
                        await window.updateDoc(window.doc(window.db, "commenti_agora", commentoId), {
                            risposte: commento.risposte
                        });
                        await caricaListaCommentiRedazione();
                        alert("Risposta eliminata.");
                    }
                } catch (e) {
                    console.error("Errore eliminazione risposta:", e);
                    alert("Errore durante l'eliminazione.");
                }
            }
        }

        async function caricaProposteRedazione() {
            const container = document.getElementById("lista-proposte-redazione");
            container.innerHTML = "<p>Caricamento proposte...</p>";

            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "proposte_articoli"));
                proposteInMemoria = [];
                querySnapshot.forEach(docSnap => {
                    proposteInMemoria.push({ id: docSnap.id, ...docSnap.data() });
                });

                container.innerHTML = "";
                if (proposteInMemoria.length === 0) {
                    container.innerHTML = "<p>Nessuna proposta ricevuta.</p>";
                    return;
                }

                proposteInMemoria.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                proposteInMemoria.forEach((prop) => {
                    const div = document.createElement("div");
                    div.style.cssText = `background: ${prop.interessante ? '#f4efe6' : '#fcfbf7'}; padding: 15px; border-radius: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid ${prop.interessante ? '#b5a892' : '#d4cbb8'};`;
                    
                    div.innerHTML = `
                        <div>
                            <strong style="font-size:1.1rem; color:#111;">${prop.titolo}</strong><br>
                            <small style="color:#666;">Autore: ${prop.autore} - Inviato il: ${prop.data}</small>
                        </div>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 0.9rem; font-weight: 500; margin-right: 5px;" title="Segna come interessante">
                                <input type="checkbox" ${prop.interessante ? 'checked' : ''} onchange="toggleInteressanteProposta('${prop.id}')" style="width: 18px; height: 18px; accent-color: #333; cursor: pointer;">
                                Interessante
                            </label>
                            <button type="button" class="btn-cat" onclick="leggiProposta('${prop.id}')">LEGGI</button>
                            <button type="button" class="btn-cat" style="background:#991b1b; color:#fff; border-color:#991b1b;" onclick="scartaProposta('${prop.id}')">SCARTA</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                console.error("Errore proposte:", e);
                container.innerHTML = "<p>Errore nel caricamento delle proposte.</p>";
            }
        }

        function leggiProposta(id) {
            const prop = proposteInMemoria.find(p => p.id === id);
            if (prop) {
                document.getElementById("modale-titolo").innerText = prop.titolo;
                document.getElementById("modale-info").innerText = `Proposto da: ${prop.autore} il ${prop.data}`;
                document.getElementById("modale-testo").innerText = prop.testo;
                document.getElementById("modale-proposta").style.display = "flex";
            }
        }

        function chiudiModaleProposta() {
            document.getElementById("modale-proposta").style.display = "none";
        }

        async function scartaProposta(id) {
            if (confirm("Sei sicuro di voler scartare ed eliminare questa proposta?")) {
                try {
                    await window.deleteDoc(window.doc(window.db, "proposte_articoli", id));
                    await caricaProposteRedazione();
                } catch (e) {
                    console.error("Errore scarto proposta:", e);
                    alert("Errore durante l'eliminazione.");
                }
            }
        }

        async function toggleInteressanteProposta(id) {
            try {
                const prop = proposteInMemoria.find(p => p.id === id);
                if (prop) {
                    const nuovoStato = !prop.interessante;
                    await window.updateDoc(window.doc(window.db, "proposte_articoli", id), {
                        interessante: nuovoStato
                    });
                    await caricaProposteRedazione();
                }
            } catch (e) {
                console.error("Errore aggiornamento proposta:", e);
            }
        }

        document.getElementById("form-articolo").addEventListener("submit", async function(e) {
            e.preventDefault();
            const editId = document.getElementById("edit-id").value;
            const titolo = document.getElementById("titolo").value;
            const categoria = document.getElementById("categoria").value;
            const immagine = document.getElementById("immagine-url").value.trim();
            const testo = document.getElementById("editor-testo").innerHTML;

            if (testo.trim() === "" || testo.trim() === "<br>") {
                alert("Il testo non può essere vuoto!");
                return;
            }

            const data = new Date().toLocaleDateString();

            try {
                if (!editId) {
                    await window.addDoc(window.collection(window.db, "articoli"), {
                        titolo,
                        categoria,
                        immagine,
                        testo,
                        data,
                        timestamp: Date.now()
                    });
                    alert("Articolo pubblicato con successo su Firebase!");
                } else {
                    const artEsistente = articoliInMemoria.find(a => a.id === editId);
                    const immagineFinale = immagine || (artEsistente ? artEsistente.immagine : "");
                    
                    await window.updateDoc(window.doc(window.db, "articoli", editId), {
                        titolo,
                        categoria,
                        immagine: immagineFinale,
                        testo
                    });
                    alert("Articolo modificato con successo su Firebase!");
                    annullaModifica();
                }

                document.getElementById("form-articolo").reset();
                document.getElementById("editor-testo").innerHTML = "";
                document.getElementById("preview-container").innerHTML = "";
                document.getElementById("file-immagine").value = "";
                await caricaListaGestione();
            } catch (err) {
                console.error("Errore salvataggio articolo su Firestore:", err);
                alert("Errore durante il salvataggio su Firebase.");
            }
        });

        function preparaModifica(id) {
            const art = articoliInMemoria.find(a => a.id === id);
            if (!art) return;

            document.getElementById("edit-id").value = art.id;
            document.getElementById("titolo").value = art.titolo;
            document.getElementById("categoria").value = art.categoria;
            document.getElementById("immagine-url").value = art.immagine || "";
            document.getElementById("file-immagine").value = "";
            if (art.immagine) {
                document.getElementById("preview-container").innerHTML = `<img src="${art.immagine}" style="max-height: 100px; border-radius: 4px;" alt="Anteprima">`;
            } else {
                document.getElementById("preview-container").innerHTML = "";
            }
            document.getElementById("editor-testo").innerHTML = art.testo;

            document.getElementById("form-title").innerText = "Modifica Articolo";
            document.getElementById("btn-submit-articolo").innerText = "Salva Modifiche";
            document.getElementById("btn-annulla-modifica").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function annullaModifica() {
            document.getElementById("edit-id").value = "";
            document.getElementById("form-articolo").reset();
            document.getElementById("editor-testo").innerHTML = "";
            document.getElementById("preview-container").innerHTML = "";
            document.getElementById("file-immagine").value = "";
            document.getElementById("form-title").innerText = "Pubblica un Nuovo Articolo";
            document.getElementById("btn-submit-articolo").innerText = "Pubblica";
            document.getElementById("btn-annulla-modifica").style.display = "none";
        }

        async function eliminaArticolo(id) {
            if (confirm("Sei sicuro di voler eliminare definitivamente questo articolo?")) {
                try {
                    await window.deleteDoc(window.doc(window.db, "articoli", id));
                    await caricaListaGestione();
                    alert("Articolo eliminato da Firebase.");
                } catch (e) {
                    console.error("Errore eliminazione articolo:", e);
                    alert("Errore durante l'eliminazione.");
                }
            }
        }

        document.getElementById("form-sondaggio").addEventListener("submit", async function(e) {
            e.preventDefault();
            const categoriaScelta = document.getElementById("categoria-sondaggio").value;
            const nuovoSondaggio = document.getElementById("input-sondaggio").value;
            
            const inputsOpzioni = document.querySelectorAll(".input-opzione");
            let opzioniArray = [];
            inputsOpzioni.forEach(input => {
                if(input.value.trim() !== "") {
                    opzioniArray.push(input.value.trim());
                }
            });

            if(opzioniArray.length < 2) {
                alert("Inserisci almeno 2 opzioni valide per il sondaggio!");
                return;
            }

            try {
                await window.setDoc(window.doc(window.db, "configurazioni", "sondaggio_attivo"), {
                    categoria: categoriaScelta,
                    domanda: nuovoSondaggio,
                    opzioni: opzioniArray
                });
                alert("Sondaggio e opzioni aggiornati con successo su Firebase!");
            } catch (e) {
                console.error("Errore salvataggio sondaggio:", e);
                alert("Errore durante il salvataggio.");
            }
        });

        async function archiviaSondaggioCorrente() {
            const domanda = document.getElementById("input-sondaggio").value;
            const categoria = document.getElementById("categoria-sondaggio").value;
            const inputsOpzioni = document.querySelectorAll(".input-opzione");
            let opzioni = [];
            inputsOpzioni.forEach(i => { if(i.value.trim()) opzioni.push(i.value.trim()); });

            try {
                const votoDocSnap = await window.getDocs(window.collection(window.db, "voti_sondaggio_attivo"));
                let votiMappa = {};
                let totaleVotanti = 0;
                
                votoDocSnap.forEach(d => {
                    const data = d.data();
                    votiMappa[data.opzione] = data.conteggio || 0;
                    totaleVotanti += (data.conteggio || 0);
                });

                const sondaggioArchiviato = {
                    categoria,
                    domanda,
                    opzioni,
                    votiMappa,
                    totaleVotanti,
                    dataArchiviazione: new Date().toLocaleDateString(),
                    timestamp: Date.now()
                };

                await window.addDoc(window.collection(window.db, "sondaggi_archiviati"), sondaggioArchiviato);

                for (const d of votoDocSnap.docs) {
                    await window.deleteDoc(d.ref);
                }

                alert("Sondaggio archiviato con successo su Firebase!");
                await caricaListaSondaggiArchiviati();
            } catch (e) {
                console.error("Errore archiviazione sondaggio:", e);
                alert("Errore durante l'archiviazione.");
            }
        }

        document.getElementById("form-discussione").addEventListener("submit", async function(e) {
            e.preventDefault();
            const nuovaDiscussione = document.getElementById("input-discussione").value;

            try {
                await window.setDoc(window.doc(window.db, "configurazioni", "discussione_attiva"), {
                    argomento: nuovaDiscussione
                });

                const commentiSnap = await window.getDocs(window.collection(window.db, "commenti_agora"));
                for (const d of commentiSnap.docs) {
                    await window.deleteDoc(d.ref);
                }

                alert("Discussione aggiornata con successo su Firebase! I vecchi commenti sono stati azzerati.");
                await caricaListaCommentiRedazione();
            } catch (e) {
                console.error("Errore salvataggio discussione:", e);
                alert("Errore durante l'aggiornamento.");
            }
        });
    </script>
