<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redazione - Flusso di Coscienza</title>
    <link rel="stylesheet" href="style.css">
    <!-- SDK di Firebase Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbvUTpkonXNDj5f7amxWPilzWmYYuwywI",
            authDomain: "flusso-di-coscienza-4e96d.firebaseapp.com",
            projectId: "flusso-di-coscienza-4e96d",
            storageBucket: "flusso-di-coscienza-4e96d.firebasestorage.app",
            messagingSenderId: "617712339143",
            appId: "1:617712339143:web:75561b57885ff8c44ad6e2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const HASH_PASSWORD_CORRETTO = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9";

        document.addEventListener("DOMContentLoaded", async () => {
            if (sessionStorage.getItem("owner_logged") === "true") {
                mostraPannello();
            }
        });

        window.verificaPassword = async function() {
            const pwd = document.getElementById("owner-password").value;
            const msgBuffer = new TextEncoder().encode(pwd);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashDigitato = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

            if (hashDigitato === HASH_PASSWORD_CORRETTO) {
                sessionStorage.setItem("owner_logged", "true");
                mostraPannello();
            } else {
                alert("Password errata!");
            }
        };

        window.effettuaLogout = function() {
            sessionStorage.removeItem("owner_logged");
            location.reload();
        };

        async function mostraPannello() {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("redazione-panel").style.display = "block";
            await caricaListaGestione();
            await caricaDatiSondaggioRedazione();
            await caricaListaCommentiRedazione();
        }

        // --- ARTICOLI ---
        document.getElementById("file-immagine").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    const base64String = uploadEvent.target.result;
                    document.getElementById("immagine-base64").value = base64String;
                    document.getElementById("preview-container").innerHTML = `<img src="${base64String}" style="max-height: 100px; border-radius: 4px;">`;
                };
                reader.readAsDataURL(file);
            }
        });

        window.formatText = function(command) {
            document.execCommand(command, false, null);
        };

        document.getElementById("form-articolo").addEventListener("submit", async function(e) {
            e.preventDefault();
            const editId = document.getElementById("edit-index").value;
            const titolo = document.getElementById("titolo").value;
            const categoria = document.getElementById("categoria").value;
            const immagine = document.getElementById("immagine-base64").value;
            const testo = document.getElementById("editor-testo").innerHTML;
            const data = new Date().toLocaleDateString();

            try {
                if (editId === "-1") {
                    await addDoc(collection(db, "articoli"), { titolo, categoria, immagine, testo, data, timestamp: Date.now() });
                    alert("Articolo pubblicato su Firebase!");
                } else {
                    const docRef = doc(db, "articoli", editId);
                    await updateDoc(docRef, { titolo, categoria, immagine: immagine || undefined, testo });
                    alert("Articolo modificato!");
                    annullaModifica();
                }
                document.getElementById("form-articolo").reset();
                document.getElementById("editor-testo").innerHTML = "";
                document.getElementById("immagine-base64").value = "";
                document.getElementById("preview-container").innerHTML = "";
                await caricaListaGestione();
            } catch (err) {
                alert("Errore durante il salvataggio.");
            }
        });

        async function caricaListaGestione() {
            const container = document.getElementById("lista-gestione-articoli");
            container.innerHTML = "Caricamento...";
            try {
                const querySnapshot = await getDocs(collection(db, "articoli"));
                container.innerHTML = "";
                if (querySnapshot.empty) {
                    container.innerHTML = "<p>Nessun articolo pubblicato.</p>";
                    return;
                }
                querySnapshot.forEach((documento) => {
                    const art = documento.data();
                    const id = documento.id;
                    const div = document.createElement("div");
                    div.style.cssText = "background: #fcfbf7; padding: 15px; border-radius: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #d4cbb8;";
                    div.innerHTML = `
                        <div><strong>${art.titolo}</strong><br><small>[${art.categoria}] - ${art.data}</small></div>
                        <div style="display: flex; gap: 8px;">
                            <button type="button" class="btn-cat" onclick="eliminaArticolo('${id}')" style="background:#991b1b; color:#fff;">Elimina</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = "<p>Errore caricamento.</p>";
            }
        }

        window.eliminaArticolo = async function(id) {
            if (confirm("Eliminare questo articolo?")) {
                await deleteDoc(doc(db, "articoli", id));
                await caricaListaGestione();
                alert("Articolo eliminato.");
            }
        };

        // --- SONDAGGIO ATTIVO ---
        async function caricaDatiSondaggioRedazione() {
            try {
                const docSnap = await getDocs(collection(db, "sondaggioAttivo"));
                if (!docSnap.empty) {
                    const data = docSnap.docs[0].data();
                    document.getElementById("categoria-sondaggio").value = data.categoria || "ATTUALITA'";
                    document.getElementById("input-sondaggio").value = data.domanda || "";
                    caricaCampiOpzioni(data.opzioni || []);
                } else {
                    caricaCampiOpzioni(["Sì", "No"]);
                }
            } catch(e) {}
        }

        window.aggiungiCampoOpzione = function(valore = "") {
            const container = document.getElementById("container-opzioni");
            const div = document.createElement("div");
            div.style.cssText = "display: flex; gap: 8px; align-items: center;";
            div.innerHTML = `
                <input type="text" class="input-opzione" value="${valore}" required placeholder="Testo opzione..." style="flex:1;">
                <button type="button" class="btn-cat" style="background:#991b1b; color:#fff; border-color:#991b1b; padding: 10px 14px;" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(div);
        };

        function caricaCampiOpzioni(opzioni) {
            const container = document.getElementById("container-opzioni");
            container.innerHTML = "";
            opzioni.forEach(opt => aggiungiCampoOpzione(opt));
        }

        document.getElementById("form-sondaggio").addEventListener("submit", async function(e) {
            e.preventDefault();
            const categoria = document.getElementById("categoria-sondaggio").value;
            const domanda = document.getElementById("input-sondaggio").value;
            const opzioni = Array.from(document.querySelectorAll(".input-opzione")).map(i => i.value.trim()).filter(Boolean);

            if (opzioni.length < 2) {
                alert("Inserisci almeno 2 opzioni!");
                return;
            }

            try {
                await setDoc(doc(db, "sondaggioAttivo", "corrente"), { categoria, domanda, opzioni, voti: {}, totaleVotanti: 0 });
                alert("Sondaggio aggiornato su Firebase!");
            } catch(err) {
                alert("Errore salvataggio sondaggio.");
            }
        });

        // --- DISCUSSIONE ---
        async function caricaListaCommentiRedazione() {
            const container = document.getElementById("lista-gestione-commenti");
            container.innerHTML = "Caricamento...";
            try {
                const querySnapshot = await getDocs(collection(db, "commenti"));
                container.innerHTML = "";
                if (querySnapshot.empty) {
                    container.innerHTML = "<p>Nessun commento presente.</p>";
                    return;
                }
                querySnapshot.forEach((documento) => {
                    const com = documento.data();
                    const id = documento.id;
                    const div = document.createElement("div");
                    div.style.cssText = "background: #fcfbf7; padding: 15px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #d4cbb8; display: flex; justify-content: space-between; align-items: center;";
                    div.innerHTML = `
                        <div>
                            <strong>${com.autore}</strong> <small>(${com.data})</small>
                            <p style="margin: 5px 0 0 0;">${com.testo}</p>
                        </div>
                        <button type="button" class="btn-cat" style="background:#991b1b; color:#fff;" onclick="eliminaCommento('${id}')">Elimina</button>
                    `;
                    container.appendChild(div);
                });
            } catch(e) {
                container.innerHTML = "<p>Errore caricamento commenti.</p>";
            }
        }

        window.eliminaCommento = async function(id) {
            if (confirm("Eliminare questo commento?")) {
                await deleteDoc(doc(db, "commenti", id));
                await caricaListaCommentiRedazione();
                alert("Commento eliminato.");
            }
        };
    </script>
</head>
<body>
    <header>
        <h1 class="titolo-ibrido">Redazione</h1>
        <p>Area Riservata Owner</p>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="leggi.html">Leggi</a>
            <a href="vota.html">Vota</a>
            <a href="proponi.html">Proponi</a>
            <a href="discuti.html">Discuti</a>
            <a href="archivio.html">Archivio</a>
            <a href="redazione.html" class="active btn-owner">Redazione</a>
        </nav>
    </header>

    <main class="container">
        <div id="login-box" class="form-container">
            <h2>Area Redazione</h2>
            <p>Inserisci la password per accedere.</p>
            <div class="form-group" style="margin-top: 25px;">
                <input type="password" id="owner-password" placeholder="Password segreta...">
            </div>
            <button type="button" class="btn-pubblica" onclick="verificaPassword()">Accedi</button>
        </div>

        <div id="redazione-panel" style="display: none;">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
                <button type="button" class="btn-cat" style="background:#991b1b; color:#fff;" onclick="effettuaLogout()">Logout</button>
            </div>

            <!-- Articolo -->
            <div class="form-container" style="margin-bottom: 40px;">
                <h2 id="form-title">Pubblica un Nuovo Articolo</h2>
                <form id="form-articolo" style="margin-top: 25px;">
                    <input type="hidden" id="edit-index" value="-1">
                    <div class="form-group">
                        <label>Titolo</label>
                        <input type="text" id="titolo" required placeholder="Titolo...">
                    </div>
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="categoria">
                            <option value="ATTUALITA'">ATTUALITA'</option>
                            <option value="POLITICA">POLITICA</option>
                            <option value="SCIENZA">SCIENZA</option>
                            <option value="FILOSOFIA">FILOSOFIA</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Copertina</label>
                        <input type="file" id="file-immagine" accept="image/*">
                        <input type="hidden" id="immagine-base64">
                        <div id="preview-container" style="margin-top: 10px;"></div>
                    </div>
                    <div class="form-group">
                        <label>Articolo</label>
                        <div class="editor-toolbar">
                            <button type="button" onclick="formatText('bold')"><b>B</b></button>
                            <button type="button" onclick="formatText('italic')"><i>I</i></button>
                        </div>
                        <div id="editor-testo" contenteditable="true" class="editor-content"></div>
                    </div>
                    <button type="submit" id="btn-submit-articolo" class="btn-pubblica">Pubblica su Firebase</button>
                </form>
            </div>

            <!-- Gestione Articoli -->
            <div class="form-container" style="margin-bottom: 40px;">
                <h2>Gestione Articoli</h2>
                <div id="lista-gestione-articoli" style="margin-top: 20px;">Caricamento...</div>
            </div>

            <!-- Sondaggio -->
            <div class="form-container" style="margin-bottom: 40px;">
                <h2>Sondaggio Attivo</h2>
                <form id="form-sondaggio" style="margin-top: 25px;">
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="categoria-sondaggio">
                            <option value="ATTUALITA'">ATTUALITA'</option>
                            <option value="POLITICA">POLITICA</option>
                            <option value="SCIENZA">SCIENZA</option>
                            <option value="FILOSOFIA">FILOSOFIA</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Domanda</label>
                        <input type="text" id="input-sondaggio" required>
                    </div>
                    <div class="form-group">
                        <label>Opzioni di Voto</label>
                        <div id="container-opzioni" style="display: flex; flex-direction: column; gap: 10px;"></div>
                        <button type="button" class="btn-cat" style="margin-top: 10px;" onclick="aggiungiCampoOpzione()">+ Aggiungi Opzione</button>
                    </div>
                    <button type="submit" class="btn-pubblica" style="margin-top: 20px;">Salva Sondaggio</button>
                </form>
            </div>

            <!-- Moderazione Discussione -->
            <div class="form-container" style="margin-bottom: 40px;">
                <h2>Moderazione Discussione</h2>
                <div id="lista-gestione-commenti" style="margin-top: 20px;">Caricamento...</div>
            </div>
        </div>
    </main>
</body>
</html>
