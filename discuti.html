<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discuti - Flusso di Coscienza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="site-header">
        <h1>Flusso di Coscienza</h1>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="leggi.html">Leggi</a>
            <a href="vota.html">Vota</a>
            <a href="proponi.html">Proponi</a>
            <a href="discuti.html" class="active">Discuti</a>
            <a href="archivio.html">Archivio</a>
            <a href="redazione.html" class="btn-owner">Redazione</a>
        </nav>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>Dibattito Aperto</h2>
            <div class="form-group" style="margin-top: 20px;">
                <input type="text" id="autore-commento" placeholder="Il tuo nome..." style="margin-bottom: 10px;">
                <textarea id="testo-commento" rows="4" placeholder="Scrivi il tuo pensiero..."></textarea>
                <button type="button" class="btn-pubblica" onclick="inviaCommento()" style="margin-top: 10px;">Pubblica Intervento</button>
            </div>

            <div id="lista-commenti" style="margin-top: 30px;">Caricamento discussione...</div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbvUTpkonXNDj5f7amxWPilzWmYYuwywI",
            authDomain: "flusso-di-coscienza-4e96d.firebaseapp.com",
            projectId: "flusso-di-coscienza-4e96d",
            storageBucket: "flusso-di-coscienza-4e96d.firebasestorage.app",
            messagingSenderId: "617712339143",
            appId: "1:617712339143:web:75561b57885ff8c44ad6e2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener("DOMContentLoaded", () => {
            caricaCommenti();
        });

        window.inviaCommento = async function() {
            const autore = document.getElementById("autore-commento").value.trim() || "Anonimo";
            const testo = document.getElementById("testo-commento").value.trim();
            if (!testo) {
                alert("Il commento non può essere vuoto!");
                return;
            }

            try {
                await addDoc(collection(db, "commenti"), {
                    autore,
                    testo,
                    data: new Date().toLocaleDateString(),
                    timestamp: Date.now()
                });
                document.getElementById("testo-commento").value = "";
                document.getElementById("autore-commento").value = "";
                await caricaCommenti();
                alert("Intervento pubblicato con successo!");
            } catch (err) {
                alert("Errore nell'invio del commento.");
            }
        };

        async function caricaCommenti() {
            const container = document.getElementById("lista-commenti");
            container.innerHTML = "Caricamento...";
            try {
                const querySnapshot = await getDocs(collection(db, "commenti"));
                container.innerHTML = "";
                if (querySnapshot.empty) {
                    container.innerHTML = "<p>Nessun intervento. Sii il primo a commentare!</p>";
                    return;
                }
                let commenti = [];
                querySnapshot.forEach(doc => commenti.push(doc.data()));
                commenti.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                commenti.forEach(com => {
                    container.innerHTML += `
                        <div style="background:#f4f1ea; padding:15px; border-radius:6px; margin-bottom:12px; border-left:4px solid #111;">
                            <strong>${com.autore}</strong> <small style="color:#666;">(${com.data})</small>
                            <p style="margin-top:8px;">${com.testo}</p>
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = "<p>Errore nel caricamento dei commenti.</p>";
            }
        }
    </script>
</body>
</html>
