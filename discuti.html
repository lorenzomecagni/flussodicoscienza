<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discuti - Flusso di Coscienza</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .commento-card {
            background: #f4f1ea;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #111;
            position: relative;
        }
        .commento-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-like {
            background: transparent;
            border: 1px solid #d4cbb8;
            border-radius: 20px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            color: #333;
        }
        .btn-like:hover {
            background: #e6dfd1;
            border-color: #b5a892;
        }
        .btn-like.liked {
            background: #111;
            color: #fff;
            border-color: #111;
        }
        .risposta-card {
            background: #eadecd;
            padding: 14px 16px;
            border-radius: 6px;
            margin-top: 10px;
            border-left: 3px solid #555;
            text-align: justify;
        }
        .box-rispondi {
            margin-top: 15px;
            padding: 15px;
            background: #fcfbf7;
            border: 1px solid #d4cbb8;
            border-radius: 6px;
        }
        .commento-card p {
            text-align: justify;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <header id="site-header">
        <h1 id="titolo-dinamico" class="titolo-ibrido"></h1>
        <p>pensieri liberi</p>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="leggi.html">Leggi</a>
            <a href="vota.html">Vota</a>
            <a href="proponi.html">Proponi</a>
            <a href="discuti.html" class="active">Discuti</a>
            <a href="archivio.html">Archivio</a>
            <a href="redazione.html" class="btn-owner">Redazione</a>
        </nav>
    </header>

    <main class="container">
        <div class="form-container">
            <h2 id="titolo-dibattito" style="text-align: justify;">Dibattito del Mese</h2>
            <p>Lascia un commento o un pensiero libero in risposta al dibattito mensile[cite: 3].</p>
            
            <div class="form-group" style="margin-top: 25px;">
                <input type="text" id="autore-commento" placeholder="Il tuo nome..." style="margin-bottom: 12px;">
                <textarea id="testo-commento" rows="4" placeholder="Esprimi il tuo pensiero..."></textarea>
                <button type="button" class="btn-pubblica" onclick="aggiungiCommento()" style="margin-top: 15px;">Pubblica Intervento</button>
            </div>

            <div id="lista-commenti" style="margin-top: 30px;">Caricamento discussioni...</div>
        </div>
    </main>

    <!-- SDK Firebase e logica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbvUTpkonXNDj5f7amxWPilzWmYYuwywI",
            authDomain: "flusso-di-coscienza-4e96d.firebaseapp.com",
            projectId: "flusso-di-coscienza-4e96d",
            storageBucket: "flusso-di-coscienza-4e96d.firebasestorage.app",
            messagingSenderId: "617712339143",
            appId: "1:617712339143:web:75561b57885ff8c44ad6e2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener("scroll", () => {
            const header = document.getElementById("site-header");
            if (window.scrollY > 50) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });

        document.addEventListener("DOMContentLoaded", async () => {
            const testoTitolo = "Flusso di Coscienza";
            const classiFont = ['l-0', 'l-1', 'l-2', 'l-3', 'l-4', 'l-5', 'l-6', 'l-7', 'l-8', 'l-9', 'l-10', 'l-11', 'l-12', 'l-13', 'l-14', 'l-15', 'l-16', 'l-17'];
            const h1Element = document.getElementById("titolo-dinamico");
            if (h1Element) {
                h1Element.innerHTML = "";
                for (let i = 0; i < testoTitolo.length; i++) {
                    const span = document.createElement("span");
                    span.innerText = testoTitolo[i];
                    span.className = classiFont[Math.floor(Math.random() * classiFont.length)];
                    h1Element.appendChild(span);
                }
            }

            await caricaCommenti();
        });

        window.aggiungiCommento = async function() {
            const autore = document.getElementById("autore-commento").value.trim() || "Anonimo";
            const testo = document.getElementById("testo-commento").value.trim();
            if (!testo) {
                alert("Il testo del commento non può essere vuoto!");
                return;
            }

            try {
                await addDoc(collection(db, "commenti"), {
                    autore,
                    testo,
                    data: new Date().toLocaleDateString(),
                    likes: 0,
                    risposte: [],
                    timestamp: Date.now()
                });

                document.getElementById("testo-commento").value = "";
                document.getElementById("autore-commento").value = "";
                await caricaCommenti();
                alert("Intervento pubblicato con successo!");
            } catch (err) {
                console.error("Errore nell'invio:", err);
                alert("Errore durante la pubblicazione del commento.");
            }
        };

        async function caricaCommenti() {
            const lista = document.getElementById("lista-commenti");
            lista.innerHTML = "Caricamento...";
            let mieiLikes = JSON.parse(localStorage.getItem("like_miei_commenti")) || [];

            try {
                const querySnapshot = await getDocs(collection(db, "commenti"));
                let commenti = [];
                querySnapshot.forEach(docSnap => {
                    commenti.push({ id: docSnap.id, ...docSnap.data() });
                });

                commenti.sort((a, b) => (b.likes || 0) - (a.likes || 0));
                lista.innerHTML = "";

                if (commenti.length === 0) {
                    lista.innerHTML = "<p style='color: #666; font-style: italic;'>Nessun intervento ancora. Sii il primo a esprimere il tuo pensiero!</p>";
                    return;
                }

                commenti.forEach(com => {
                    const giaMessoLike = mieiLikes.includes(com.id);

                    let risposteHtml = "";
                    if (com.risposte && com.risposte.length > 0) {
                        com.risposte.forEach(resp => {
                            risposteHtml += `
                                <div class="risposta-card">
                                    <strong>${resp.autore}</strong> <small style="color:#666;">(${resp.data})</small>
                                    <p style="margin-top:6px; line-height:1.4; color:#333; text-align: justify; word-break: break-word;">${resp.testo}</p>
                                </div>
                            `;
                        });
                    }

                    const div = document.createElement("div");
                    div.className = "commento-card";
                    div.innerHTML = `
                        <div class="commento-header">
                            <div>
                                <strong>${com.autore}</strong> 
                                <small style="color:#666;">(${com.data})</small>
                            </div>
                            <button type="button" class="btn-like ${giaMessoLike ? 'liked' : ''}" onclick="toggleLike('${com.id}', ${com.likes || 0})">
                                ❤️ <span>${com.likes || 0}</span>
                            </button>
                        </div>
                        <p style="margin-top:10px; line-height:1.6; color:#222;">${com.testo}</p>
                        
                        <div style="margin-top: 12px;">
                            <button type="button" class="btn-cat" style="font-size: 0.85rem; padding: 6px 12px;" onclick="mostraFormRisposta('${com.id}')">Rispondi</button>
                        </div>

                        <div id="form-risposta-${com.id}" class="box-rispondi" style="display: none;">
                            <div class="form-group" style="margin-bottom: 0;">
                                <input type="text" id="autore-risposta-${com.id}" placeholder="Il tuo nome..." style="margin-bottom: 10px;">
                                <textarea id="testo-risposta-${com.id}" rows="3" placeholder="Scrivi una risposta..."></textarea>
                                <button type="button" class="btn-pubblica" style="margin-top: 12px; width: auto; padding: 10px 20px;" onclick="inviaRisposta('${com.id}')">Invia Risposta</button>
                            </div>
                        </div>

                        <div style="margin-top: 12px; padding-left: 20px; border-left: 2px solid #d4cbb8;">
                            ${risposteHtml}
                        </div>
                    `;
                    lista.appendChild(div);
                });
            } catch (err) {
                console.error("Errore caricamento commenti:", err);
                lista.innerHTML = "<p>Errore nel caricamento della discussione.</p>";
            }
        }

        window.toggleLike = async function(id, likesAttuali) {
            let mieiLikes = JSON.parse(localStorage.getItem("like_miei_commenti")) || [];
            const haGiaVotato = mieiLikes.includes(id);
            const ref = doc(db, "commenti", id);

            let nuovoTotale = haGiaVotato ? likesAttuali - 1 : likesAttuali + 1;
            if (nuovoTotale < 0) nuovoTotale = 0;

            if (haGiaVotato) {
                mieiLikes = mieiLikes.filter(likeId => likeId !== id);
            } else {
                mieiLikes.push(id);
            }

            try {
                await updateDoc(ref, { likes: nuovoTotale });
                localStorage.setItem("like_miei_commenti", JSON.stringify(mieiLikes));
                await caricaCommenti();
            } catch (err) {
                alert("Impossibile aggiornare il mi piace.");
            }
        };

        window.mostraFormRisposta = function(id) {
            const box = document.getElementById(`form-risposta-${id}`);
            box.style.display = box.style.display === "none" || box.style.display === "" ? "block" : "none";
        };

        window.inviaRisposta = async function(commentoId) {
            const autore = document.getElementById(`autore-risposta-${commentoId}`).value.trim() || "Anonimo";
            const testo = document.getElementById(`testo-risposta-${commentoId}`).value.trim();

            if (!testo) {
                alert("La risposta non può essere vuota!");
                return;
            }

            try {
                const docRef = doc(db, "commenti", commentoId);
                const snap = await getDoc(docRef); // Recupera il documento attuale per aggiornare l'array risposte
                // Nota: importiamo getDoc se non c'è già, oppure usiamo direttamente un approccio sicuro
                // Semplifichiamo aggiungendo la risposta tramite transazione o aggiornando l'array.
                // Ricarichiamo prima il documento:
            } catch (e) {}
        };
    </script>
</body>
</html>
