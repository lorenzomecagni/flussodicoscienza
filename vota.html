<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vota - Flusso di Coscienza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="site-header">
        <h1>Flusso di Coscienza</h1>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="leggi.html">Leggi</a>
            <a href="vota.html" class="active">Vota</a>
            <a href="proponi.html">Proponi</a>
            <a href="discuti.html">Discuti</a>
            <a href="archivio.html">Archivio</a>
            <a href="redazione.html" class="btn-owner">Redazione</a>
        </nav>
    </header>

    <main class="container">
        <div class="form-container">
            <span id="categoria-badge" class="categoria"></span>
            <h2 id="titolo-sondaggio" style="margin-top: 10px;">Caricamento sondaggio...</h2>
            
            <div id="opzioni-container" style="margin-top: 20px;"></div>
            <button type="button" id="btn-vota" class="btn-pubblica" style="margin-top: 20px; display:none;" onclick="inviaVoto()">Invia Voto</button>

            <div id="area-risultati" style="margin-top: 25px; display:none;">
                <h3>Risultati in Tempo Reale</h3>
                <div id="grafico-risultati" style="margin-top: 15px;"></div>
                <p id="totale-votanti" style="margin-top: 10px; font-weight: bold;"></p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbvUTpkonXNDj5f7amxWPilzWmYYuwywI",
            authDomain: "flusso-di-coscienza-4e96d.firebaseapp.com",
            projectId: "flusso-di-coscienza-4e96d",
            storageBucket: "flusso-di-coscienza-4e96d.firebasestorage.app",
            messagingSenderId: "617712339143",
            appId: "1:617712339143:web:75561b57885ff8c44ad6e2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let sondaggioCorrente = null;

        document.addEventListener("DOMContentLoaded", async () => {
            const snap = await getDoc(doc(db, "sondaggioAttivo", "corrente"));
            if (snap.exists()) {
                sondaggioCorrente = snap.data();
                document.getElementById("titolo-sondaggio").innerText = sondaggioCorrente.domanda;
                document.getElementById("categoria-badge").innerText = sondaggioCorrente.categoria;
                
                const haVotato = localStorage.getItem("ha_votato_firebase") === "true";
                if (haVotato) {
                    mostraRisultati(sondaggioCorrente);
                } else {
                    mostraOpzioni(sondaggioCorrente.opzioni);
                }
            } else {
                document.getElementById("titolo-sondaggio").innerText = "Nessun sondaggio attivo al momento.";
            }
        });

        function mostraOpzioni(opzioni) {
            const container = document.getElementById("opzioni-container");
            container.innerHTML = "";
            opzioni.forEach((opt, idx) => {
                container.innerHTML += `
                    <div style="margin-bottom: 10px;">
                        <input type="radio" name="voto" id="opt_${idx}" value="${opt}">
                        <label for="opt_${idx}" style="cursor:pointer; font-weight:bold; margin-left:8px;">${opt}</label>
                    </div>
                `;
            });
            document.getElementById("btn-vota").style.display = "block";
        }

        window.inviaVoto = async function() {
            const selezionato = document.querySelector('input[name="voto"]:checked');
            if (!selezionato) {
                alert("Seleziona un'opzione!");
                return;
            }
            const scelta = selezionato.value;
            const ref = doc(db, "sondaggioAttivo", "corrente");
            
            let voti = sondaggioCorrente.voti || {};
            voti[scelta] = (voti[scelta] || 0) + 1;
            let totale = (sondaggioCorrente.totaleVotanti || 0) + 1;

            await updateDoc(ref, { voti: voti, totaleVotanti: totale });
            localStorage.setItem("ha_votato_firebase", "true");
            
            sondaggioCorrente.voti = voti;
            sondaggioCorrente.totaleVotanti = totale;
            
            document.getElementById("opzioni-container").style.display = "none";
            document.getElementById("btn-vota").style.display = "none";
            mostraRisultati(sondaggioCorrente);
            alert("Voto registrato con successo!");
        };

        function mostraRisultati(data) {
            const grafico = document.getElementById("grafico-risultati");
            grafico.innerHTML = "";
            const totale = data.totaleVotanti || 0;
            const voti = data.voti || {};

            data.opzioni.forEach(opt => {
                const count = voti[opt] || 0;
                const perc = totale > 0 ? ((count / totale) * 100).toFixed(1) : 0;
                grafico.innerHTML += `
                    <div style="margin-bottom:10px;">
                        <span>${opt} - <strong>${perc}%</strong> (${count} voti)</span>
                        <div style="background:#ddd; border-radius:4px; height:10px; width:100%; margin-top:4px;">
                            <div style="background:#111; height:100%; width:${perc}%; border-radius:4px;"></div>
                        </div>
                    </div>
                `;
            });
            document.getElementById("totale-votanti").innerText = `Partecipanti totali: ${totale}`;
            document.getElementById("area-risultati").style.display = "block";
        }
    </script>
</body>
</html>
