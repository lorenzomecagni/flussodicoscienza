<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vota - Flusso di Coscienza</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .opzione-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            margin-bottom: 12px;
            background: #fdfbf7;
            border: 1px solid #d4cbb8;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .opzione-card:hover {
            background: #f4efe6;
            border-color: #b5a892;
        }
        .opzione-card input[type="radio"] {
            accent-color: #333;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .opzione-card label {
            cursor: pointer;
            font-weight: 500;
            color: #222;
            flex: 1;
            margin: 0;
            text-align: justify;
        }
        .risultato-barra-container {
            margin-bottom: 16px;
        }
        .risultato-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 6px;
            font-weight: 500;
            color: #333;
        }
        .barra-esterna {
            background: #e6dfd1;
            border-radius: 6px;
            height: 12px;
            width: 100%;
            overflow: hidden;
        }
        .barra-interna {
            background: #333;
            height: 100%;
            width: 0%;
            transition: width 0.6s ease;
            border-radius: 6px;
        }

        .archivio-sondaggi-section {
            margin-top: 50px;
        }
        .carosello-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .carosello-wrapper {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 20px;
            scroll-behavior: smooth;
            width: 100%;
            padding: 10px 0;
        }
        .carosello-wrapper::-webkit-scrollbar {
            height: 8px;
        }
        .carosello-wrapper::-webkit-scrollbar-thumb {
            background: #d4cbb8;
            border-radius: 4px;
        }
        .sondaggio-card-archivio {
            flex: 0 0 100%;
            max-width: 100%;
            scroll-snap-align: start;
            background: #fdfbf7;
            border: 1px solid #d4cbb8;
            border-radius: 8px;
            padding: 25px;
            box-sizing: border-box;
        }
        .btn-carosello {
            background: #333;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        .btn-carosello.prev { left: -20px; }
        .btn-carosello.next { right: -20px; }
    </style>
</head>
<body>
    <header id="site-header">
        <h1 id="titolo-dinamico" class="titolo-ibrido"></h1>
        <p>pensieri liberi</p>
        <nav class="main-nav">
            <a href="index.html">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Home
            </a>
            <a href="leggi.html">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg> Leggi
            </a>
            <a href="vota.html" class="active">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg> Vota
            </a>
            <a href="proponi.html">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg> Proponi
            </a>
            <a href="discuti.html">
                <svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg> Discuti
            </a>
            <a href="archivio.html">
                <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg> Archivio
            </a>
            <a href="redazione.html" class="btn-owner">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg> Redazione
            </a>
        </nav>
    </header>

    <main class="container">
        <!-- Sondaggio Principale -->
        <div class="form-container">
            <!-- Categoria SOPRA al quesito -->
            <div style="margin-bottom: 12px;">
                <span id="categoria-badge" class="categoria" style="font-size: 0.85rem;"></span>
            </div>
            <h2 id="titolo-sondaggio" style="margin: 0 0 20px 0; font-size: 1.8rem; text-align: justify;">Topic del Mese</h2>
            
            <form id="sondaggio-form">
                <div id="opzioni-container" style="margin-top: 15px;"></div>
                <button type="submit" id="btn-invia-voto" class="btn-pubblica" style="margin-top: 10px;">Invia Voto</button>
            </form>

            <div id="area-risultati" style="margin-top: 25px; display: none;">
                <hr style="border: 0; border-top: 1px solid #d4cbb8; margin-bottom: 20px;">
                <h3 style="margin-bottom: 15px; font-size: 1.2rem;">Risultati Provvisori</h3>
                <div id="grafico-risultati"></div>
                <p id="totale-votanti" style="margin-top: 15px; font-size: 0.95rem; color: #555; text-align: right;"></p>
            </div>
        </div>

        <!-- Sezione Carosello Sondaggi Archiviati -->
        <div class="archivio-sondaggi-section" id="sezione-archivio-sondaggi" style="display: none;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px;">
                <svg style="width:28px; height:28px; fill:currentColor;" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
                <h2 style="margin: 0; font-size: 1.5rem; text-align: center;">Archivio Sondaggi</h2>
            </div>
            <div class="carosello-container">
                <button type="button" class="btn-carosello prev" onclick="scorriCarosello(-1)">&#10094;</button>
                <div class="carosello-wrapper" id="carosello-sondaggi-wrapper"></div>
                <button type="button" class="btn-carosello next" onclick="scorriCarosello(1)">&#10095;</button>
            </div>
        </div>
    </main>

    <script>
        window.addEventListener("scroll", () => {
            const header = document.getElementById("site-header");
            if (window.scrollY > 50) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            const testoTitolo = "Flusso di Coscienza";
            const classiFont = ['l-0', 'l-1', 'l-2', 'l-3', 'l-4', 'l-5', 'l-6', 'l-7', 'l-8', 'l-9', 'l-10', 'l-11', 'l-12', 'l-13', 'l-14', 'l-15', 'l-16', 'l-17'];
            const h1Element = document.getElementById("titolo-dinamico");
            if (h1Element) {
                h1Element.innerHTML = "";
                for (let i = 0; i < testoTitolo.length; i++) {
                    const span = document.createElement("span");
                    span.innerText = testoTitolo[i];
                    span.className = classiFont[Math.floor(Math.random() * classiFont.length)];
                    h1Element.appendChild(span);
                }
            }

            caricaSondaggio();
            caricaSondaggiArchiviati();
        });

        function getCategoriaClasse(categoria) {
            const mapping = {
                "ATTUALITA'": "cat-attualita",
                "POLITICA": "cat-politica",
                "SCIENZA": "cat-scienza",
                "RELIGIONE": "cat-religione",
                "ECONOMIA": "cat-economia",
                "ARTE": "cat-arte",
                "FILOSOFIA": "cat-filosofia",
                "LETTERATURA": "cat-letteratura",
                "MUSICA": "cat-musica",
                "VIAGGI": "cat-viaggi",
                "STORIA": "cat-storia",
                "CINEMA": "cat-cinema",
                "VIDEOGIOCHI": "cat-videogiochi"
            };
            return mapping[categoria] || "cat-filosofia";
        }

        function caricaSondaggio() {
            const categoria = localStorage.getItem("categoria_sondaggio") || "ATTUALITA'";
            const badge = document.getElementById("categoria-badge");
            badge.innerText = categoria;
            badge.className = `categoria ${getCategoriaClasse(categoria)}`;

            const domanda = localStorage.getItem("topic_sondaggio") || "L'intelligenza artificiale sostituirà il pensiero critico umano?";
            document.getElementById("titolo-sondaggio").innerText = domanda;

            let opzioni = JSON.parse(localStorage.getItem("opzioni_sondaggio"));
            if (!opzioni) {
                opzioni = ["Sì, inevitabilmente", "No, stimolerà nuove forme di pensiero", "Dipende da come la utilizzeremo"];
            }

            const container = document.getElementById("opzioni-container");
            container.innerHTML = "";

            const haVotato = localStorage.getItem("utente_ha_votato") === "true";

            if (haVotato) {
                document.getElementById("sondaggio-form").style.display = "none";
                mostraRisultati(opzioni);
            } else {
                opzioni.forEach((opt, index) => {
                    const card = document.createElement("div");
                    card.className = "opzione-card";
                    card.innerHTML = `
                        <input type="radio" name="voto" id="opt_${index}" value="${opt}" required>
                        <label for="opt_${index}">${opt}</label>
                    `;
                    card.addEventListener("click", (e) => {
                        if(e.target.tagName !== 'INPUT') {
                            document.getElementById(`opt_${index}`).checked = true;
                        }
                    });
                    container.appendChild(card);
                });
            }
        }

        document.getElementById("sondaggio-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const votoSelezionato = document.querySelector('input[name="voto"]:checked');
            
            if (!votoSelezionato) {
                alert("Seleziona un'opzione prima di votare!");
                return;
            }

            const valoreVoto = votoSelezionato.value;

            let votiMappa = JSON.parse(localStorage.getItem("voti_sondaggio")) || {};
            votiMappa[valoreVoto] = (votiMappa[valoreVoto] || 0) + 1;
            
            let totaleVotanti = parseInt(localStorage.getItem("totale_votanti") || "0") + 1;

            localStorage.setItem("voti_sondaggio", JSON.stringify(votiMappa));
            localStorage.setItem("totale_votanti", totaleVotanti);
            localStorage.setItem("utente_ha_votato", "true");

            alert("Grazie per aver votato! Il tuo pensiero è stato registrato.");
            location.reload();
        });

        function mostraRisultati(opzioni) {
            const areaRisultati = document.getElementById("area-risultati");
            const graficoContainer = document.getElementById("grafico-risultati");
            const etichettaTotale = document.getElementById("totale-votanti");

            let votiMappa = JSON.parse(localStorage.getItem("voti_sondaggio")) || {};
            let totaleVotanti = parseInt(localStorage.getItem("totale_votanti") || "0");

            graficoContainer.innerHTML = "";

            opzioni.forEach(opt => {
                let votiOpzione = votiMappa[opt] || 0;
                let percentuale = totaleVotanti > 0 ? ((votiOpzione / totaleVotanti) * 100).toFixed(1) : 0;

                const div = document.createElement("div");
                div.className = "risultato-barra-container";
                div.innerHTML = `
                    <div class="risultato-info">
                        <span>${opt}</span>
                        <span>${percentuale}% (${votiOpzione} voti)</span>
                    </div>
                    <div class="barra-esterna">
                        <div class="barra-interna" style="width: ${percentuale}%;"></div>
                    </div>
                `;
                graficoContainer.appendChild(div);
            });

            etichettaTotale.innerText = `Numero totale partecipanti: ${totaleVotanti}`;
            areaRisultati.style.display = "block";
        }

        function caricaSondaggiArchiviati() {
            const archivio = JSON.parse(localStorage.getItem("archivio_sondaggi")) || [];
            const sezione = document.getElementById("sezione-archivio-sondaggi");
            const wrapper = document.getElementById("carosello-sondaggi-wrapper");

            if (archivio.length === 0) {
                sezione.style.display = "none";
                return;
            }

            sezione.style.display = "block";
            wrapper.innerHTML = "";

            archivio.forEach(sondaggio => {
                const card = document.createElement("div");
                card.className = "sondaggio-card-archivio";
                const classeCat = getCategoriaClasse(sondaggio.categoria);

                let barreHTML = "";
                sondaggio.opzioni.forEach(opt => {
                    let votiOpt = sondaggio.votiMappa[opt] || 0;
                    let perc = sondaggio.totaleVotanti > 0 ? ((votiOpt / sondaggio.totaleVotanti) * 100).toFixed(1) : 0;
                    barreHTML += `
                        <div class="risultato-barra-container">
                            <div class="risultato-info">
                                <span>${opt}</span>
                                <span>${perc}% (${votiOpt} voti)</span>
                            </div>
                            <div class="barra-esterna">
                                <div class="barra-interna" style="width: ${perc}%;"></div>
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <span class="categoria ${classeCat}" style="font-size: 0.8rem;">${sondaggio.categoria}</span>
                        <small style="color: #666;">Archiviato il: ${sondaggio.dataArchiviazione}</small>
                    </div>
                    <h3 style="margin-bottom: 20px; font-size: 1.15rem; color: #111; text-align: justify;">${sondaggio.domanda}</h3>
                    <div>${barreHTML}</div>
                    <p style="margin-top: 15px; font-size: 0.9rem; color: #555; text-align: right;">Numero totale partecipanti: ${sondaggio.totaleVotanti}</p>
                `;
                wrapper.appendChild(card);
            });
        }

        function scorriCarosello(direzione) {
            const wrapper = document.getElementById("carosello-sondaggi-wrapper");
            const ampiezzaCard = wrapper.querySelector(".sondaggio-card-archivio").offsetWidth + 20;
            wrapper.scrollBy({ left: direzione * ampiezzaCard, behavior: 'smooth' });
        }
    </script>
</body>
</html>
